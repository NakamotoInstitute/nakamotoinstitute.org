[project]
name = "sni"
version = "0.1.0"
description = "Advancing and preserving bitcoin knowledge"
requires-python = ">=3.12"
dependencies = [
    "alembic-postgresql-enum==1.11.1",
    "beautifulsoup4==4.15.0",
    "boto3==1.44.4",
    "fastapi[standard]==0.163.2",
    "feedgen==1.0.0",
    "markdown-it-py==4.3.0",
    "mdit-py-plugins==0.7.0",
    "psycopg[binary,pool]==3.3.9",
    "pydantic-settings==2.16.3",
    "pygments==2.21.0",
    "pyyaml==6.0.3",
    "SQLAlchemy[asyncio]==2.1.9",
    "typer==0.29.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-PyYaml==6.0.12.20261113",
]

[tool.uv]
package = false

[tool.ruff]
lint.select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]
"**/routers.py" = ["B008"]
